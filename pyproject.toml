[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridmon"
version = "0.2.0"
description = "BESS grid-event monitor: synthetic generator, conventional DSP baseline, ML comparison (simulation-only)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "matplotlib", "pyyaml", "tqdm", "joblib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
